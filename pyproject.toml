[project]
name = "snia_rise"
version = "0.1.0"
description = "Hierarchical Bayesian Modeling of Early-time SNe Ia Light Curves"
authors = [
  { name = "slowdivePTG" }
]
requires-python = ">=3.11,<3.13"

dependencies = [
  "numpy",
  "seaborn",
  "jax>=0.8.0",
  "numpyro>=0.19.0",
  "arviz",
  "corner",
  "xarray",
  "scikit-learn",
  "astropy>=7.1.0",
  "redback>=1.12.1",
  "statsmodels>=0.14.6",
  "graphviz>=0.21",
]

[project.optional-dependencies]
cuda = [
  "jax[cuda12]>=0.8.0",
]

[[tool.uv.index]]
name = "jax-releases"
url = "https://storage.googleapis.com/jax-releases/jax_cuda_releases.html"
explicit = true

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
    "ipywidgets>=8.1.7",
    "jupyter>=1.1.1",
]

[tool.setuptools]
packages = ["snia_rise"]
