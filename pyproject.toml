[project]
name = "snia_rise"
version = "0.1.0"
description = "Hierarchical Bayesian Modeling of Early-time SNe Ia Light Curves"
authors = [
  { name = "slowdivePTG" }
]
requires-python = ">=3.11,<3.13"

dependencies = [
  "numpy>=2.2.0,<2.4.0",
  "seaborn",
  "jax>=0.8.0",
  "numpyro>=0.19.0",
  "arviz",
  "corner",
  "xarray",
  "scikit-learn",
  "astropy>=7.1.0",
  "redback>=1.12.1",
  "statsmodels>=0.14.6",
  "graphviz>=0.21",
  "pyyaml",
]

[project.scripts]
snia-rise-calibrate = "snia_rise.cli.calibrate_single:main"
export-ztf-early-late-bundle = "snia_rise.cli.export_ztf_early_late:main"
snia-rise-fit = "snia_rise.cli.fit_single:main"

[project.optional-dependencies]
cuda = [
  "jax[cuda12]>=0.8.0",
]
calibration = [
  "bayesn>=0.4.0",
  "sncosmo>=2.12.1",
  "emcee>=3.1.6",
]

[[tool.uv.index]]
name = "jax-releases"
url = "https://storage.googleapis.com/jax-releases/jax_cuda_releases.html"
explicit = true

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
    "ipywidgets>=8.1.7",
    "jupyter>=1.1.1",
]

[tool.setuptools.packages.find]
include = ["snia_rise*"]

[tool.setuptools.package-data]
snia_rise = ["resources/priors/*.yaml"]
