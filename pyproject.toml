[project]
name = "snia_rise"
version = "0.1.0"
description = "Hierarchical Bayesian Modeling of Early-time SNe Ia Light Curves"
authors = [
  { name = "slowdivePTG" }
]
requires-python = ">=3.12"

dependencies = [
  "numpy",
  "matplotlib",
  "seaborn",
  "numpyro",
  "jax[cuda12_local]==0.4.35",
  "arviz",
  "corner",
  "xarray",
  "scikit-learn",
  "astropy>=7.1.0",
  "redback>=1.12.1",
  "statsmodels>=0.14.6",
  "graphviz>=0.21",
]

[[tool.uv.index]]
name = "jax-releases"
url = "https://storage.googleapis.com/jax-releases/jax_cuda_releases.html"
explicit = true

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
    "ipywidgets>=8.1.7",
    "jupyter>=1.1.1",
]

[tool.setuptools]
packages = ["snia_rise"]
